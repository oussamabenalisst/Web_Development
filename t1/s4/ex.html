<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css.css" />
    <style>
      label {
        color: tan;
      }
    </style>
  </head>
  <body>
    <form action="" class="center">
      <fieldset>
        <legend>formulaire</legend>
        <table class="center bold">
          <tr>
            <td><label for="nom" style="color: red">Nom *</label></td>
            <td>
              <input
                type="text"
                name="nom"
                id="nom"
                placeholder="Saisir votre nom"
                required
              />
            </td>
          </tr>
          <tr>
            <td><label for="prenom" style="color: red">Prénom *</label></td>
            <td>
              <input
                type="text"
                name="prenom"
                id="prenom"
                placeholder="Saisir votre prénom"
                required
              />
            </td>
          </tr>
          <tr>
            <td><label for="date_naissance"> Date de naissance</label></td>
            <td>
              <input
                type="date"
                name="date_naissance"
                id="date_naissance"
                placeholder="Saisir votre date de naissance"
                required
              />
            </td>
          </tr>
          <tr>
            <td><label for="ville">ville</label></td>
            <td>
              <select name="ville" id="ville">
                <option value="" selected>Tunis</option>
                <option value="paris">Paris</option>
                <option value="marseille">Marseille</option>
                <option value="lyon">Lyon</option>
              </select>
            </td>
          </tr>
          <tr>
            <td><label for="specialite">specialite</label></td>
            <td>
              <input
                type="radio"
                name="specialite"
                id="BI"
                value="BI"
                required
              />
              BI
              <br />
              <input
                type="radio"
                name="specialite"
                id="GLST"
                value="GLST"
                required
              />
              GLST
              <br />
              <input
                type="radio"
                name="specialite"
                id="IRS"
                value="IRS"
                required
              />
              IRS
              <br />
            </td>
          </tr>
          <tr>
            <td><label for="email">Email</label></td>
            <td>
              <input
                type="Email"
                name="email"
                id="email"
                placeholder="Saisir votre email"
                required
              />
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <input type="reset" value="Annuler" />
              <input type="submit" name="submit" id="submit" value="submit" />
            </td>
          </tr>
        </table>
      </fieldset>
    </form>
  </body>
</html>
